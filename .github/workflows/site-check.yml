name: Website preview checks
on:
  push:
    branches: [main, repo-homepage]
    paths: [index.html, evocenter.html, legacy.html, release.json, '**/release.json', 'site/**', 'Tools/**', 'ArtMotion/*.html', 'IslandBlur/*.html', '.github/workflows/site-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check responsive layouts and interactions
        run: python Tools/check-homepage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-previews
          path: site-check-artifacts/
          retention-days: 7
